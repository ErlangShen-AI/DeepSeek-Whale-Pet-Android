name: Android

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: 构建发布包
    runs-on: ubuntu-latest
    env:
      WHALE_KEYSTORE_PASSWORD: ${{ secrets.WHALE_KEYSTORE_PASSWORD }}
      WHALE_KEY_ALIAS: ${{ secrets.WHALE_KEY_ALIAS }}
      WHALE_KEY_PASSWORD: ${{ secrets.WHALE_KEY_PASSWORD }}
    steps:
      - name: 配置 Git 默认分支
        run: |
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false

      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 还原签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.WHALE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/whale.jks"
          printf 'WHALE_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/whale.jks" >> "$GITHUB_ENV"

      - name: 运行单元测试
        run: ./gradlew :app:test --console=plain

      - name: 编译发布包
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 校验签名
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          CERTS=$(JAVA_OPTS="--enable-native-access=ALL-UNNAMED" "$SIGNER" verify --print-certs "$APK")
          printf '%s\n' "$CERTS"
          if printf '%s' "$CERTS" | grep -q "CN=Android Debug"; then
            printf '发布包仍在使用调试签名\n'
            exit 1
          fi
          BADGING=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          if "$BADGING" dump badging "$APK" | grep -q "application-debuggable"; then
            printf '发布包仍为可调试构建\n'
            exit 1
          fi
          printf '签名主体与发布密钥一致，且为不可调试构建\n'

      - name: 整理产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DeepSeek-Whale-Pet.apk

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: DeepSeek-Whale-Pet
          path: dist/DeepSeek-Whale-Pet.apk
          if-no-files-found: error

      - name: 上传到发布页
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: 最新构建
          files: dist/DeepSeek-Whale-Pet.apk
          make_latest: true
